services:
  emr-db:
    image: mariadb:10.6
    container_name: emr-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mariadbpassword}
      MYSQL_DATABASE: ${DB_NAME:-emr_db}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  emr-backend:
    image: python:3.10-slim
    container_name: emr-backend
    restart: always
    ports:
      - "8080:5000"
    environment:
      DB_HOST: emr-db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-mariadbpassword}
      DB_NAME: ${DB_NAME:-emr_db}
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    depends_on:
      emr-db:
        condition: service_healthy
